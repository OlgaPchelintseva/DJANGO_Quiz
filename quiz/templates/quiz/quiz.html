{% extends 'quiz/base.html' %}
{% block title %} Вопрос №{{ index }} {% endblock %}
{% block content %}
    <div>
        <h1>Вопрос № {{ index }} из {{ all_questions }}</h1>
        <h3>{{ question }}</h3>
        <form method="post">
            {% csrf_token %}
            <div>
                {% for option in options %}
                    <label>
                        <input type="radio" name="answer" value="{{ option }}" required>
                        {{ option }}
                    </label>
                {% endfor %}
            </div>
            <button type="submit">Ответить</button>
        </form>
    </div>
{% endblock %}
